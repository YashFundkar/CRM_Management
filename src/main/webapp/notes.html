<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Management</title>

     <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <nav class="navbar px-4 py-3 shadow"
     style="background:linear-gradient(90deg,#0f172a,#1e293b);">

    <div class="d-flex align-items-center">

        <div class="bg-info rounded p-2 me-3">
            <i class="bi bi-graph-up-arrow text-white fs-4"></i>
        </div>

        <div>
            <h4 class="text-white m-0 fw-bold">
                CRM SYSTEM
            </h4>
            <small class="text-light">
                Manage Customers Efficiently
            </small>
        </div>

    </div>

	    <div class="mx-auto" style="width:400px;">
	
	    <div class="input-group shadow-sm">
	
	        <span class="input-group-text bg-light border-0">
	            <i class="bi bi-search"></i>
	        </span>
	
	        <input type="text"
	               class="form-control bg-light border-0"
	               placeholder="Search anything...">
	
	    </div>
	
	   </div>
    <div class="ms-auto d-flex align-items-center">

        <i class="bi bi-house-door-fill text-white fs-5 mx-3"></i>
        <i class="bi bi-bell-fill text-white fs-5 mx-3"></i>
        <i class="bi bi-gear-fill text-white fs-5 mx-3"></i>

        <img src="https://img.icons8.com/color/96/user-male-circle--v1.png"
             width="45"
             class="ms-3">
    </div>

</nav>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 bg-white vh-100 p-3 shadow">

                <div class="list-group">
                    <a href="DASHBOARD" class="list-group-item">📊 Dashboard</a>
                    <a href="customer.html" class="list-group-item">👥 Customers</a>
                    <a href="appointment.html" class="list-group-item">📅 Appointments</a>
                    <a href="notes.html" class="list-group-item active">📝 Notes</a>
                    <a href="BRANCH" class="list-group-item ">🏢 Branch</a>
			       <a href="report.jsp" class="list-group-item">📈 Report</a>
                    <a href="LOGOUT" class="list-group-item">🚪 Logout</a>
                </div>

            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">

                <!-- Header -->
                <div class="card mb-4">

                    <div class="card-header bg-dark text-white">
                        <h1>Add Note</h1>
                        <p>Enter Note Details</p>
                    </div>

                    <div class="card-body p-4">

                        <form action="NOTES" method="post">

                            <div class="row g-3">

                                <div class="col-md-3">
                                    <input
                                        type="text"
                                        name="customerName"
                                        class="form-control"
                                        placeholder="Customer Name"
                                        autofocus
                                        required>
                                </div>

                                <div class="col-md-2">
                                    <input
                                        type="text"
                                        name="noteTitle"
                                        class="form-control"
                                        placeholder="Note Title"
                                        required>
                                </div>

                                <div class="col-md-2">
                                    <input
                                        type="date"
                                        name="noteDate"
                                        class="form-control"
                                        required>
                                </div>

                                <div class="col-md-3">
                                    <textarea
                                        name="noteDescription"
                                        class="form-control"
                                        rows="1"
                                        placeholder="Enter Note"
                                        required></textarea>
                                </div>

                                <div class="col-md-2">
                                    <button
                                        type="submit"
                                        name="action"
                                        value="addNote"
                                        class="btn btn-success w-100">
                                        Add
                                    </button>
                                </div>

                            </div>

                        </form>

                    </div>

                </div>

                <!-- Table -->
                  <div class="card border-0 shadow-lg rounded-4">

    <div class="card-body text-center p-5">

        <div style="font-size:70px;">👥</div>

        <h3 class="fw-bold mt-3">
            Recent Notes
        </h3>

        <p class="text-muted">
            Access Notes ,edit notes, details .
        </p>

        <form action="SHOW_NOTES" method="post">

            <button class="btn btn-primary btn-lg px-5">
                Show Notes
            </button>

        </form>

    </div>

</div>

</div>
        <div class="text-center">
            <footer>
                <p>
                    CRM Management System
                    Developed by <b>Yash Fundkar</b>
                    2026
                </p>
            </footer>
        </div>

    </div>

</body>
</html>
