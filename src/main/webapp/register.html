<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRM Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
}

.left-panel{
    background:linear-gradient(135deg,#0d6efd,#6610f2);
    color:white;
}

.register-card{
    border:none;
    border-radius:20px;
}

.feature-box{
    background:rgba(255,255,255,0.15);
    border-radius:15px;
    padding:15px;
    text-align:center;
}

.crm-img{
    width:220px;
}
</style>

</head>

<body>

<div class="container-fluid">
<div class="row min-vh-100">

    <!-- LEFT SIDE -->
    <div class="col-lg-5 left-panel d-flex align-items-center">

        <div class="container text-center">

            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
                 class="crm-img mb-4">

            <h1 class="fw-bold">
                Join CRM System
            </h1>

            <p class="lead mt-3 mb-5">
                Create your account and start managing
                customers, appointments and reports
                efficiently.
            </p>

            <div class="row g-3">

                <div class="col-6">
                    <div class="feature-box">
                        🚀<br>
                        Quick Setup
                    </div>
                </div>

                <div class="col-6">
                    <div class="feature-box">
                        🔒<br>
                        Secure Access
                    </div>
                </div>

                <div class="col-6">
                    <div class="feature-box">
                        📊<br>
                        Smart Reports
                    </div>
                </div>

                <div class="col-6">
                    <div class="feature-box">
                        ☁️<br>
                        Centralized Data
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="col-lg-7 bg-light d-flex align-items-center justify-content-center">

        <div class="card register-card shadow-lg p-4" style="max-width:700px;width:100%;">

            <div class="card-body">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Create Account
                    </h2>

                    <p class="text-muted">
                        Get started in less than a minute
                    </p>

                </div>

                <form action="CustomerRegisterServlet" method="post">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="name"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="tel"
                                   class="form-control"
                                   pattern="[0-9]{10}"
                                   name="phone"
                                   placeholder="2345678900" 
                                   title = "Enter exactly 10 digits without country code" "
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date"
                                   class="form-control"
                                   name="dob">
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Gender</label>

                            <select class="form-select" name="gender">
                                <option selected disabled>Select</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Branch</label>

                            <select class="form-select"
                                    name="branch"
                                    required>

                                <option selected disabled>
                                    Select Branch
                                </option>

                                <option>SHEGAON</option>
                                <option>PUNE</option>
                                <option>AKOLA</option>

                            </select>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Enter Password"
                                   pattern=".{8,}"
                                   title="Enter at least 8 characters"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="confirmPassword"
                                   required>
                        </div>

                    </div>

                    <div class="form-check mb-4">

                        <input class="form-check-input"
                               type="checkbox"
                               required>

                        <label class="form-check-label">
                            I agree to Terms & Conditions
                        </label>

                    </div>

                    <button class="btn btn-success w-100 py-2">
                        Create Account
                    </button>

                    <div class="text-center mt-3">

                        Already have an account?

                        <a href="login.html"
                           class="text-decoration-none fw-bold">

                            Login

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
</div>

</body>
</html>
